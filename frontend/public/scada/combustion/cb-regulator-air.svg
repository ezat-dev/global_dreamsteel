<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 29" width="44" height="29">
  <!-- 연소 BLOWER 배관 압력 조절밸브 — cb-regulator-gas.svg(MAIN GAS 쪽)와 같은 도형에 색만 파랑이다.
       모양을 고치면 두 파일을 같이 고칠 것.

       원본 작화는 이 자리(blower-pre)에 네모 상자 + 옆 단자 그림(솔레노이드 모양)을 두었다.
       그 배관에는 솔밸브 자리가 따로 없어 맞바꿀 짝이 없으므로, 사용자 지시(2026-11)대로
       MAIN GAS 쪽 압력 조절밸브 그림을 가져와 BLOWER 색(blower-pre0.svg의 파랑)으로 칠했다. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc2fa"/>
      <stop offset=".42" stop-color="#4a9df0"/>
      <stop offset="1" stop-color="#2f7fd4"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8dafc"/>
      <stop offset=".5" stop-color="#4a9df0"/>
      <stop offset="1" stop-color="#2f7fd4"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9a9a9"/>
      <stop offset=".45" stop-color="#7e7e7e"/>
      <stop offset="1" stop-color="#5f5f5f"/>
    </linearGradient>
  </defs>

  <!-- 좌우 플랜지 -->
  <rect x=".6" y="15.4" width="6.4" height="13.2" rx="1" fill="url(#body)" stroke="#23649f" stroke-width=".8"/>
  <rect x="37" y="15.4" width="6.4" height="13.2" rx="1" fill="url(#body)" stroke="#23649f" stroke-width=".8"/>
  <!-- 플랜지와 본체 사이 강관 -->
  <rect x="6.8" y="18" width="7.6" height="8.4" fill="url(#steel)"/>
  <rect x="29.6" y="18" width="7.6" height="8.4" fill="url(#steel)"/>
  <!-- 밸브 본체 -->
  <rect x="14.2" y="14.6" width="15.6" height="14" rx="1.6" fill="url(#body)" stroke="#23649f" stroke-width=".8"/>
  <!-- 돔 목 -->
  <rect x="15.6" y="9.4" width="12.8" height="4.6" rx=".8" fill="url(#dome)" stroke="#23649f" stroke-width=".7"/>
  <!-- 다이어프램 돔 -->
  <ellipse cx="22" cy="5.8" rx="14.4" ry="5.2" fill="url(#dome)" stroke="#23649f" stroke-width=".8"/>
  <ellipse cx="22" cy="4.6" rx="10.6" ry="2.6" fill="#cfe4fb" opacity=".55"/>
</svg>
