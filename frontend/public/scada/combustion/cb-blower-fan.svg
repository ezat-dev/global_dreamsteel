<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 68" width="86" height="68">
  <!-- 연소 BLOWER 송풍기 — 현장 사진(2026-11-27)을 옮긴 것. 축이 가로인 옆모습이다.
       칸(blower-pump, 43x34)의 두 배 좌표로 그렸다(비율 그대로).
         토출 덕트     x  0~30, y  3~21   왼쪽 흰 공기관(pipe136, 칸 y 1~11)이 여기로 들어온다.
                                         사진은 위로 나가지만 화면 배관이 왼쪽 위라 그쪽으로 뺐다.
         흡입 필터     x  2~24, y 26~66   (앞 덮개 + 철망 통)
         송풍 케이싱   x 24~38, y  3~66   (옆에서 본 볼류트, 볼트)
         커플링 덮개   x 42~60, y 36~58   (노랑)
         베어링·모터   x 60~74, y 34~60
       x 74부터는 화면에서 연소 BLOWER 판에 가려진다 — 그래서 그림을 그 안에 몰았다.
       값이 0이면 CombustionPage.css가 통째로 빨강(#cb-red)으로 물들이므로 색은 사진 그대로 둔다. -->
  <defs>
    <linearGradient id="bf-case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f7f7e"/>
      <stop offset=".45" stop-color="#b9d0ce"/>
      <stop offset="1" stop-color="#557574"/>
    </linearGradient>
    <linearGradient id="bf-cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7f7e"/>
      <stop offset=".4" stop-color="#c3d8d6"/>
      <stop offset="1" stop-color="#557574"/>
    </linearGradient>
    <linearGradient id="bf-mesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9aaa6"/>
      <stop offset=".45" stop-color="#ecebe6"/>
      <stop offset="1" stop-color="#9c9d99"/>
    </linearGradient>
    <linearGradient id="bf-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a400"/>
      <stop offset=".4" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#b89400"/>
    </linearGradient>
    <linearGradient id="bf-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d747b"/>
      <stop offset=".45" stop-color="#c9ced3"/>
      <stop offset="1" stop-color="#5f666d"/>
    </linearGradient>
    <pattern id="bf-net" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V3" stroke="#8d8e8a" stroke-width=".6"/>
    </pattern>
  </defs>

  <g stroke="#3d4f4e" stroke-width="1" stroke-linejoin="round">
    <!-- 받침대 -->
    <rect x="20" y="62" width="56" height="5" rx="1" fill="url(#bf-steel)"/>

    <!-- 토출 덕트(왼쪽 위) + 이음 플랜지 -->
    <rect x="0" y="4" width="30" height="16" fill="url(#bf-cyl)"/>
    <rect x="3" y="2" width="4" height="20" rx="1" fill="url(#bf-case)"/>

    <!-- 흡입 필터: 철망 통 + 앞 덮개 -->
    <rect x="9" y="28" width="16" height="36" fill="url(#bf-mesh)"/>
    <rect x="9" y="28" width="16" height="36" fill="url(#bf-net)" stroke="none"/>
    <path d="M10 26 V66 H6 Q2 66 2 60 V32 Q2 26 6 26 Z" fill="url(#bf-cyl)"/>

    <!-- 송풍 케이싱(볼류트 옆모습) -->
    <path d="M25 6 Q25 3 28 3 H35 Q38 3 38 6 V64 Q38 66 36 66 H27 Q25 66 25 64 Z" fill="url(#bf-case)"/>

    <!-- 축 이음 -->
    <rect x="38" y="41" width="5" height="10" fill="url(#bf-steel)"/>

    <!-- 노랑 커플링 덮개 -->
    <rect x="42" y="36" width="18" height="22" rx="2" fill="url(#bf-yellow)" stroke="#7d6500"/>

    <!-- 베어링·모터 -->
    <path d="M60 38 Q60 34 64 34 H71 Q74 34 74 38 V60 H60 Z" fill="url(#bf-steel)"/>
  </g>

  <!-- 볼트·덮개 이음선·필터 테 -->
  <g fill="#2f3d3c">
    <circle cx="31.5" cy="8" r="1"/><circle cx="31.5" cy="20" r="1"/><circle cx="31.5" cy="32" r="1"/>
    <circle cx="31.5" cy="44" r="1"/><circle cx="31.5" cy="56" r="1"/>
    <circle cx="67" cy="42" r="1.2"/><circle cx="67" cy="54" r="1.2"/>
  </g>
  <g stroke="#3d4f4e" stroke-width=".8" fill="none">
    <path d="M9 28 V64 M25 28 V64"/>
    <path d="M42 47 H60" stroke="#7d6500" opacity=".6"/>
  </g>
</svg>
