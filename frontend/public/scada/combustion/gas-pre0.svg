<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 31 31" width="31" height="31">
  <!-- 가스 배관 압력계. 원본 gas-pre0.png(31x31)의 픽셀 배치를 그대로 옮긴 것.
       화면에서 그림을 가로·세로 따로 늘려 그려서(useStageStretch) 작은 PNG는
       흐려지고 찌그러지기 때문에 벡터로 다시 그렸다.

       원본 좌표(픽셀맵에서 잰 값):
         왼쪽 배관 토막  x 0~9,   y 0~6
         계기 몸통       x 9~23,  y 0~13   (위가 그림 밖으로 잘려 있다)
         목·눈금         x 9~23,  y 13~18  (x14·x21에 회색 눈금)
         밸브 본체(연노랑) x 4~27, y 20~29
         좌우 플랜지     x 1~3.5 / 27.5~31, y 19~29
         가운데 손잡이   x 13~18, y 21~27
         볼트 자국(회색) x 9~13 / 18~22, y 24.5~27 -->
  <defs>
    <!-- 관과 같은 원통 음영: 위 밝고 아래 어둡게 -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd979"/>
      <stop offset=".42" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#dd8c00"/>
    </linearGradient>
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d4"/>
      <stop offset=".5" stop-color="#ffe884"/>
      <stop offset="1" stop-color="#e5c451"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset=".45" stop-color="#767676"/>
      <stop offset="1" stop-color="#585858"/>
    </linearGradient>
    <radialGradient id="dial" cx=".36" cy=".34" r=".8">
      <stop offset="0" stop-color="#ffdd8a"/>
      <stop offset="1" stop-color="#f2a000"/>
    </radialGradient>
  </defs>

  <!-- 왼쪽으로 뻗은 배관 토막 -->
  <rect x="0" y=".4" width="9.6" height="5.6" rx=".8" fill="url(#body)"/>

  <!-- 계기 목 + 눈금 -->
  <rect x="9" y="12.5" width="14.8" height="5.6" fill="url(#body)" stroke="#c47f00" stroke-width=".7"/>
  <rect x="13.6" y="14.2" width="1.6" height="3.2" fill="url(#steel)"/>
  <rect x="20.6" y="14.2" width="1.6" height="3.2" fill="url(#steel)"/>

  <!-- 계기 몸통 — 위가 그림 밖으로 잘린다(원본과 같게) -->
  <circle cx="16.4" cy="6.4" r="7.4" fill="url(#dial)" stroke="#c47f00" stroke-width=".8"/>
  <circle cx="16.4" cy="6.4" r="3.4" fill="none" stroke="#fff3c9" stroke-width=".9" opacity=".8"/>

  <!-- 밸브 본체 -->
  <rect x="9.8" y="17.8" width="11.8" height="12.6" rx="1" fill="url(#pale)"/>
  <rect x="4" y="20.4" width="23.4" height="8.2" rx="1" fill="url(#pale)" stroke="#c0992f" stroke-width=".7"/>

  <!-- 좌우 플랜지 -->
  <rect x=".8" y="18.8" width="3.2" height="10.4" rx=".7" fill="url(#body)"/>
  <rect x="27.2" y="18.8" width="3.2" height="10.4" rx=".7" fill="url(#body)"/>

  <!-- 볼트 자국 -->
  <rect x="8.8" y="24.4" width="4.2" height="2.6" fill="url(#steel)"/>
  <rect x="18.2" y="24.4" width="4.2" height="2.6" fill="url(#steel)"/>

  <!-- 가운데 손잡이 -->
  <rect x="12.8" y="20.8" width="5.4" height="6.4" rx=".8" fill="url(#body)" stroke="#c47f00" stroke-width=".6"/>
  <rect x="14.6" y="21.6" width="1.8" height="2.2" fill="url(#steel)"/>
</svg>
