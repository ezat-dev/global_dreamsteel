<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.2 2 34.6 34.6" width="34.6" height="34.6">
  <!-- 가스 배관 압력 조절밸브. 원본 gas-pre0.png(31x31).

       '압력 이상' 위의 blower-pre0.svg와 같은 기기다 — 도형이 똑같고 방향과 색만 다르다.
       그래서 그 파일을 좌우로 뒤집고 색만 주황으로 바꿔 쓴다. 모양을 고칠 일이 생기면
       두 파일을 같이 고쳐야 한다.

       처음에는 이걸 '원형 계기판'으로 잘못 보고 딴 물건을 그렸다. 위에 달린 것은
       계기가 아니라 구동부(다이어프램)이고, 아래 가로 배관이 유체가 지나는 길이다.

       viewBox는 칸(31x31)에 맞춰 정사각으로 잡았다. 원래 그림이 37x39라 가로로 조금
       넓히고 위아래로 여백을 두어 정사각을 만들었다 — CSS에 object-fit: cover가 걸려
       있어서 비율이 어긋나면 잘린다.
       뒤집기는 translate(37,0) scale(-1,1)이다. 37은 원래 그림의 폭이라, 이 식이
       그림을 제자리에서 좌우로 뒤집어 준다. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset=".38" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#f5cf6a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd979"/>
      <stop offset=".45" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#dd8c00"/>
    </linearGradient>
  </defs>

  <g transform="translate(37, 0) scale(-1, 1)">
    <!-- 구동부 -->
    <rect x="9.6" y="3.6" width="17.4" height="19" rx="1.4" fill="url(#body)"/>
    <rect x="11.6" y="5.6" width="13.4" height="12.4" rx=".8" fill="url(#glass)"/>
    <!-- 파일럿 접속구 (뒤집혀서 화면에서는 왼쪽으로 간다) -->
    <rect x="27" y="6.2" width="7.4" height="6.4" rx="1" fill="url(#body)"/>
    <rect x="28.8" y="8.4" width="3.8" height="2" fill="#fff3cc"/>
    <!-- 구동부와 밸브를 잇는 목 -->
    <rect x="14.4" y="22.6" width="7.8" height="3.6" fill="url(#body)"/>
    <!-- 밸브 본체 -->
    <rect x="9.6" y="26" width="17.4" height="8.4" rx="1.4" fill="url(#body)"/>
    <rect x="12" y="28.4" width="12.6" height="3.4" rx=".6" fill="#fff6d8" opacity=".85"/>
    <!-- 좌우 플랜지 -->
    <rect x="2.6" y="24.4" width="6" height="11.6" rx="1" fill="url(#body)"/>
    <rect x="28" y="24.4" width="6" height="11.6" rx="1" fill="url(#body)"/>
  </g>
</svg>
