<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2.57 44 35.86" width="44" height="35.86">
  <!-- 존 버너 가스 밸브(다이어프램 구동). 원본 for-1-zone-valve-20.png(50x41)의
       픽셀 배치를 그대로 옮긴 것.

       28개 자리에 이 파일 하나만 쓴다. 원본은 3종(27x22 두 개 + 50x41 한 개)이었지만
       셋 다 같은 그림(돔이 왼쪽)이고, 좌우·상하 뒤집기는 작화 CSS가 맡는다.
         for-*-valve-1  변형 없음            → 돔 왼쪽
         for-*-valve-2  scale(-1, 1)         → 돔 오른쪽
         rev-*-valve-1  rotate(-180deg)      → 돔 오른쪽
         rev-*-valve-2  scale(1, -1)         → 돔 왼쪽
       그래서 파일을 바꿔 끼워도 화면에 놓이는 방향은 그대로다.

       viewBox는 원본의 내용 영역(x 3~47, y 3~38)에 세로 여백을 조금 더해 27x22 칸의
       비율(1.227)에 맞췄다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표:
         구동부 돔   x 3~14,  y 8~31   (오른쪽이 평평하고 왼쪽으로 부푼다)
         보닛 판     x 15~18, y 6~33
         축·스템     x 19~20 / 20~26 / 27, y 12~27
         본체        x 28~46, y 13~26
         위 플랜지   x 29~46, y 3~7     위 목(회색) x 33~42, y 8~12
         아래 플랜지 x 28~46, y 31~37   아래 목     x 33~42, y 27~30 -->
  <defs>
    <!-- 가로로 누운 부품: 위아래가 어둡고 가운데가 밝은 원통 음영 -->
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08c00"/>
      <stop offset=".22" stop-color="#ffc12a"/>
      <stop offset=".52" stop-color="#ffeaa6"/>
      <stop offset=".8" stop-color="#ffc12a"/>
      <stop offset="1" stop-color="#e08c00"/>
    </linearGradient>
    <!-- 세로로 선 부품: 왼쪽이 어둡고 가운데쯤이 밝다 -->
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e89400"/>
      <stop offset=".35" stop-color="#ffc42f"/>
      <stop offset=".6" stop-color="#ffeaa6"/>
      <stop offset=".85" stop-color="#ffbb1c"/>
      <stop offset="1" stop-color="#dd8a00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8d8d"/>
      <stop offset=".45" stop-color="#6e6e6e"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
  </defs>

  <!-- 위·아래 목 — 본체보다 먼저 그려 플랜지와 본체 사이로 들어간다.
       원본은 좌우에 검은 세로 레일이 있다. -->
  <g fill="url(#steel)" stroke="#141414" stroke-width=".9">
    <rect x="33.4" y="7.6" width="8.8" height="5.4"/>
    <rect x="33.4" y="26.8" width="8.8" height="5.4"/>
  </g>

  <!-- 축 2개 -->
  <rect x="18.8" y="15" width="2" height="10" fill="url(#steel)"/>
  <rect x="26.6" y="15.4" width="1.6" height="9.2" fill="url(#steel)"/>

  <!-- 본체와 플랜지 -->
  <rect x="28.2" y="13" width="18.4" height="13.6" rx=".8" fill="url(#h)" stroke="#d98800" stroke-width=".7"/>
  <rect x="28.8" y="3" width="17.8" height="4.8" rx=".7" fill="url(#h)" stroke="#d98800" stroke-width=".7"/>
  <rect x="28.2" y="31.4" width="18.4" height="6.2" rx=".7" fill="url(#h)" stroke="#d98800" stroke-width=".7"/>

  <!-- 스템 블록 -->
  <rect x="20" y="12.2" width="6.8" height="15" rx=".7" fill="url(#v)" stroke="#d98800" stroke-width=".7"/>

  <!-- 보닛 판 — 위아래로 뾰족한 얇은 판 -->
  <ellipse cx="16.5" cy="19.6" rx="2.1" ry="13.5" fill="url(#v)" stroke="#d98800" stroke-width=".6"/>

  <!-- 구동부 돔 — 오른쪽은 평평하고 왼쪽으로 부푼다.
       rx는 부푸는 폭(14.2 - 3 = 11.2), ry는 세로 길이의 절반(23.2 / 2)이다.
       ry를 절반보다 크게 잡으면 호가 덜 휘어서 돔이 얄팍한 잎사귀처럼 나온다. -->
  <path d="M14.2 8 A11.2 11.6 0 0 0 14.2 31.2 Z" fill="url(#v)" stroke="#d98800" stroke-width=".7"/>
</svg>
