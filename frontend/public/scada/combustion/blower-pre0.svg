<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 39" width="37" height="39">
  <!-- 연소 BLOWER 배관 압력계. 원본 blower-pre0.png(37x39)와 같은 실루엣.
       위 사각 계기함 + 오른쪽 접속구, 아래 밸브 본체와 좌우 플랜지. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe4fb"/>
      <stop offset=".38" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd8f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc2fa"/>
      <stop offset=".45" stop-color="#4a9df0"/>
      <stop offset="1" stop-color="#2f7fd4"/>
    </linearGradient>
  </defs>

  <!-- 계기함 -->
  <rect x="9.6" y="3.6" width="17.4" height="19" rx="1.4" fill="url(#body)"/>
  <rect x="11.6" y="5.6" width="13.4" height="12.4" rx=".8" fill="url(#glass)"/>
  <!-- 오른쪽 접속구 -->
  <rect x="27" y="6.2" width="7.4" height="6.4" rx="1" fill="url(#body)"/>
  <rect x="28.8" y="8.4" width="3.8" height="2" fill="#dcecfd"/>
  <!-- 계기함과 밸브를 잇는 목 -->
  <rect x="14.4" y="22.6" width="7.8" height="3.6" fill="url(#body)"/>
  <!-- 밸브 본체 -->
  <rect x="9.6" y="26" width="17.4" height="8.4" rx="1.4" fill="url(#body)"/>
  <rect x="12" y="28.4" width="12.6" height="3.4" rx=".6" fill="#e8f2fe" opacity=".85"/>
  <!-- 좌우 플랜지 -->
  <rect x="2.6" y="24.4" width="6" height="11.6" rx="1" fill="url(#body)"/>
  <rect x="28" y="24.4" width="6" height="11.6" rx="1" fill="url(#body)"/>
</svg>
