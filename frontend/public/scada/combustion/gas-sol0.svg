<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 29" width="44" height="29">
  <!-- 가스 배관 솔레노이드 밸브. 원본 gas-sol0.png(44x29)와 같은 실루엣.
       위쪽 갓이 솔레노이드 코일, 아래가 밸브 본체와 좌우 플랜지다. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd979"/>
      <stop offset=".42" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#dd8c00"/>
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe49b"/>
      <stop offset=".5" stop-color="#ffb713"/>
      <stop offset="1" stop-color="#e29000"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9a9a9"/>
      <stop offset=".45" stop-color="#7e7e7e"/>
      <stop offset="1" stop-color="#5f5f5f"/>
    </linearGradient>
  </defs>

  <!-- 좌우 플랜지 -->
  <rect x=".6" y="15.4" width="6.4" height="13.2" rx="1" fill="url(#body)" stroke="#c47f00" stroke-width=".8"/>
  <rect x="37" y="15.4" width="6.4" height="13.2" rx="1" fill="url(#body)" stroke="#c47f00" stroke-width=".8"/>
  <!-- 플랜지와 본체 사이 강관 -->
  <rect x="6.8" y="18" width="7.6" height="8.4" fill="url(#steel)"/>
  <rect x="29.6" y="18" width="7.6" height="8.4" fill="url(#steel)"/>
  <!-- 밸브 본체 -->
  <rect x="14.2" y="14.6" width="15.6" height="14" rx="1.6" fill="url(#body)" stroke="#c47f00" stroke-width=".8"/>
  <!-- 코일 목 -->
  <rect x="15.6" y="9.4" width="12.8" height="4.6" rx=".8" fill="url(#coil)" stroke="#c47f00" stroke-width=".7"/>
  <!-- 솔레노이드 코일(갓) -->
  <ellipse cx="22" cy="5.8" rx="14.4" ry="5.2" fill="url(#coil)" stroke="#c47f00" stroke-width=".8"/>
  <ellipse cx="22" cy="4.6" rx="10.6" ry="2.6" fill="#ffdf92" opacity=".55"/>
</svg>
