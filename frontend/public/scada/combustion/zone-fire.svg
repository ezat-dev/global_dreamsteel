         속불(f3)보다 확실히 작게 둔다 — 크면 불꽃 전체가 파랗게 보여서
         불완전연소한 찬 불처럼 읽힌다. 뿌리께에 파란 기가 도는 정도가 맞다. -->
    <path class="lick f4" fill="url(#blue)"
