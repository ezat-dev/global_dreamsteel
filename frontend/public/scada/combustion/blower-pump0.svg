<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 43 34" width="43" height="34">
  <!-- 연소 BLOWER 송풍기. 원본 blower-pump0.png(43x34)와 같은 실루엣.
       원형 케이싱(볼류트) + 가운데 허브, 왼쪽 위 흡입구, 아래 받침. -->
  <defs>
    <radialGradient id="case" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#d3e7fc"/>
      <stop offset="1" stop-color="#8fc0f4"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc2fa"/>
      <stop offset=".45" stop-color="#4a9df0"/>
      <stop offset="1" stop-color="#2f7fd4"/>
    </linearGradient>
  </defs>

  <!-- 흡입구 -->
  <rect x=".8" y="2.4" width="10.6" height="9.6" rx="1.2" fill="url(#body)"/>
  <rect x="2.8" y="4.4" width="2.6" height="5.6" fill="#e8f2fe" opacity=".8"/>
  <!-- 케이싱 -->
  <circle cx="24.5" cy="17.6" r="15.4" fill="url(#case)" stroke="#4a9df0" stroke-width="1.6"/>
  <!-- 허브 -->
  <circle cx="24.5" cy="17.6" r="7" fill="none" stroke="#4a9df0" stroke-width="1.6"/>
  <circle cx="24.5" cy="17.6" r="3" fill="#eaf4ff" stroke="#4a9df0" stroke-width="1.2"/>
  <!-- 받침 -->
  <rect x="11.6" y="30.6" width="26" height="3" rx=".8" fill="url(#body)"/>
</svg>
