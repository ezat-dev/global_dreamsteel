<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 68 80" width="68" height="80">
  <!-- 존 버너 밸브(작은 것). 원본 obj21.png(73x85)의 픽셀 배치를 그대로 옮긴 것.
       상단 존 14개 + 하단 존 14개가 같은 그림이고, 하단은 작화 CSS가 180도 돌려 쓴다
       (위아래가 대칭이라 돌려도 같아 보인다).

       viewBox를 원본의 내용 영역(x 2~70, y 2~82)으로 잡았다. 그래야 19x22 칸에
       넣었을 때 여백 없이 꽉 차면서 비율도 맞는다(68/80 = 0.85, 19/22 = 0.86).

       원본 좌표:
         위 어깨   x 14~59, y 2~6        위 플랜지 x 2~69,  y 6~17
         목        x 11~61, y 17~21      몸통      x 16~55, y 21~64
         디스크    x 19~53, y 30~56      들여다보이는 구멍 x 23~30 / 42~49, y 36~48
         아래는 위와 대칭 -->
  <defs>
    <!-- 플랜지: 위가 어둡고 아래로 갈수록 밝다(원본이 그렇다) -->
    <linearGradient id="flange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5d5d"/>
      <stop offset=".45" stop-color="#a8a8a8"/>
      <stop offset=".8" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <!-- 몸통: 가운데가 밝은 원통 음영 -->
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b6b6b"/>
      <stop offset=".35" stop-color="#c9c9c9"/>
      <stop offset=".6" stop-color="#9e9e9e"/>
      <stop offset="1" stop-color="#5f5f5f"/>
    </linearGradient>
    <!-- 구멍은 검은 디스크 위에 얹히므로 밝아야 보인다 -->
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#a2a2a2"/>
    </linearGradient>
  </defs>

  <!-- 선은 얇게. 19px 칸으로 줄여 그리므로 굵으면 뭉쳐 보인다
       (원본 2px / 73폭 = 이 좌표계에서 약 1.2). -->
  <g stroke="#232323" stroke-width="1.2" stroke-linejoin="round">
    <!-- 몸통 (플랜지보다 먼저 그려 아래로 깔린다) -->
    <rect x="16.8" y="20" width="38.4" height="45" fill="url(#barrel)"/>

    <!-- 위 플랜지 -->
    <path d="M15 3 H58 L61 6.8 H12 Z" fill="#4a4a4a"/>
    <path d="M12 17 H61 L58 20.6 H15 Z" fill="#4a4a4a"/>
    <rect x="2.8" y="6.8" width="67.4" height="10.2" fill="url(#flange)"/>

    <!-- 아래 플랜지 -->
    <path d="M15 81 H58 L61 77.2 H12 Z" fill="#4a4a4a"/>
    <path d="M12 67 H61 L58 63.4 H15 Z" fill="#4a4a4a"/>
    <rect x="2.8" y="67" width="67.4" height="10.2" fill="url(#flange)"/>
  </g>

  <!-- 디스크 — 밸브 판을 옆에서 본 것. 검은 타원 안으로 구멍 두 개가 비친다.
       구멍 두 개는 가운데 검은 축(x 31~41)을 사이에 두고 확실히 떨어져 있어야 한다 —
       붙으면 구멍 하나짜리 다른 부품으로 보인다. -->
  <ellipse cx="36" cy="43" rx="18" ry="13.4" fill="#141414"/>
  <ellipse cx="26.8" cy="42.5" rx="3.8" ry="6.6" fill="url(#eye)"/>
  <ellipse cx="45.2" cy="42.5" rx="3.8" ry="6.6" fill="url(#eye)"/>
</svg>
