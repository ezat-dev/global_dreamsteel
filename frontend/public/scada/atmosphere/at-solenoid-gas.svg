<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68">
  <!-- ADDITION GAS 솔레노이드 밸브 — 네모난 코일 상자에 전선 단자가 옆으로 붙은 모양.
       원본 gas-pre0.png(68x68)의 픽셀 배치를 옮긴 것.

       원본 작화는 이 그림을 압력 자리(gas-pre)에 두었는데, 모양으로 보면 솔레노이드라
       솔밸브 자리(gas-sol)로 옮겼다(2026-10). 파일 이름도 그때 모양에 맞게 바꿨다.
       은색판이 at-solenoid-air.svg다. 모양을 고치면 두 파일을 같이 고쳐야 한다.

       viewBox가 칸(68x68)과 같다. 공기 쪽 칸은 77x77이지만 둘 다 정사각이라 같은
       viewBox로 통한다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표:
         전선 단자   x  0~20, y  0~14   (코일 상자에서 왼쪽으로 뻗는 부분)
         코일 상자   x 19~53, y  0~32   (네모. 가운데 세로로 밝은 띠가 지난다)
         플랜지 띠   x 19~53, y 32~38
         세로 통로   x 19~51, y 38~68
         가로 배관   x  3~67, y 42~61  (가운데 연한색, 양 끝 플랜지)

       코일 상자는 네모 하나다. 종 모양으로 굴리거나 안에 동그라미를 그려 넣으면
       원본에 없는 곡면이 생겨 다른 물건이 된다. 두 번 다 그렇게 틀렸다. -->
  <defs>
    <!-- 코일 상자: 좌우가 어둡고 가운데가 밝다(원본의 세로 하이라이트) -->
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98c00"/>
      <stop offset=".18" stop-color="#f5a300"/>
      <stop offset=".45" stop-color="#ffd24a"/>
      <stop offset=".72" stop-color="#f5a300"/>
      <stop offset="1" stop-color="#cf8300"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98c00"/>
      <stop offset=".35" stop-color="#ffb300"/>
      <stop offset=".6" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#cf8300"/>
    </linearGradient>
    <!-- 배관 속살: 거의 흰 크림색 -->
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".45" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#f0d07a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e52"/>
      <stop offset=".45" stop-color="#8f9498"/>
      <stop offset="1" stop-color="#3f4347"/>
    </linearGradient>
  </defs>

  <g stroke="#a86a00" stroke-width=".8" stroke-linejoin="round">
    <!-- 전선 단자 — 코일 상자 왼쪽으로 뻗는다 -->
    <rect x="0" y="2.6" width="20.4" height="8.8" rx="1.2" fill="url(#body)"/>
    <rect x="4.6" y="0" width="7" height="14.4" rx="1" fill="url(#body)"/>

    <!-- 코일 상자 — 네모 하나다. 안에 동그라미를 넣지 말 것.
         원본에서 가운데가 밝은 것은 세로 하이라이트(원본 x116~172의 밝은 띠)이지
         따로 그린 둥근 판이 아니다. dome 그라데이션이 그 띠를 만든다. -->
    <rect x="18.6" y="0" width="34.4" height="32.4" rx="1.5" fill="url(#dome)"/>

    <!-- 코일 상자와 밸브를 잇는 플랜지 띠 -->
    <rect x="18.6" y="31.6" width="34.4" height="6.6" fill="url(#body)"/>

    <!-- 세로 통로 — 플랜지 띠에서 아래끝까지 내려간다 -->
    <rect x="19.2" y="38" width="31.6" height="30" fill="url(#pale)"/>

    <!-- 가로 배관 — 가운데는 연한색, 양 끝은 플랜지 -->
    <rect x="8" y="42" width="52" height="19.4" fill="url(#pale)"/>
    <rect x="2.8" y="42" width="5.8" height="19.4" rx=".8" fill="url(#body)"/>
    <rect x="61.4" y="42" width="5.8" height="19.4" rx=".8" fill="url(#body)"/>
  </g>

  <!-- 배관 이음매의 쇠 띠와 플랜지 볼트 자국 -->
  <g fill="url(#steel)">
    <rect x="9" y="42.4" width="10" height="1.8"/>
    <rect x="9" y="59.6" width="10" height="1.8"/>
    <rect x="50.6" y="42.4" width="10" height="1.8"/>
    <rect x="50.6" y="59.6" width="10" height="1.8"/>
    <rect x="3.4" y="48.6" width="4.8" height="2.4"/>
    <rect x="3.4" y="53.4" width="4.8" height="2.4"/>
    <rect x="61.8" y="48.6" width="4.8" height="2.4"/>
    <rect x="61.8" y="53.4" width="4.8" height="2.4"/>
    <!-- 플랜지 띠의 볼트 -->
    <rect x="23.4" y="33.4" width="2.6" height="3.2"/>
    <rect x="30.6" y="33.4" width="2.6" height="3.2"/>
    <rect x="37.8" y="33.4" width="2.6" height="3.2"/>
    <rect x="45" y="33.4" width="2.6" height="3.2"/>
    <!-- 가운데 스템 -->
    <rect x="33.4" y="47.6" width="3.4" height="11.6"/>
  </g>
</svg>
