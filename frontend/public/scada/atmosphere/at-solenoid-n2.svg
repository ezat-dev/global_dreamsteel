<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <!-- 질소발생기 솔레노이드 밸브 — 현장 사진(2026-11-26)을 옮긴 것.
       at-solenoid-gas/air.svg(네모 코일)와는 다른 물건이다. 이쪽은 코일이 검은 '원통'이고
       몸통 양 끝에 둥근 플랜지가 붙어 배관 사이에 끼워진다.
         검은 원통 코일  x 14~40, y  3~26   (위가 타원, 가운데 은색 꼭지)
         단자함          x 39~49, y  7~20   (코일 오른쪽에 붙은 검은 상자)
         은색 목         x 12~44, y 24~31   (모서리 볼트 넷)
         은색 몸통       x  7~49, y 31~53
         플랜지          x  1~7 / 49~55, y 28~56
       가로 배관 중심이 y 42다 — CSS에서 이 높이를 관 가운데에 맞춘다. -->
  <defs>
    <linearGradient id="sn-coil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset=".38" stop-color="#3d4045"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="sn-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f858c"/>
      <stop offset=".4" stop-color="#e6e9ec"/>
      <stop offset="1" stop-color="#6a7078"/>
    </linearGradient>
    <linearGradient id="sn-metal-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a8087"/>
      <stop offset=".45" stop-color="#e2e5e9"/>
      <stop offset="1" stop-color="#666c74"/>
    </linearGradient>
  </defs>

  <!-- 플랜지(양 끝) -->
  <rect x="1" y="28" width="6" height="28" rx="2" fill="url(#sn-metal-h)" stroke="#4a5058" stroke-width=".8"/>
  <rect x="49" y="28" width="6" height="28" rx="2" fill="url(#sn-metal-h)" stroke="#4a5058" stroke-width=".8"/>
  <circle cx="4" cy="31.5" r="1.3" fill="#c9a640"/>
  <circle cx="4" cy="52.5" r="1.3" fill="#c9a640"/>
  <circle cx="52" cy="31.5" r="1.3" fill="#c9a640"/>
  <circle cx="52" cy="52.5" r="1.3" fill="#c9a640"/>

  <!-- 몸통 -->
  <path d="M7 33 H49 V51 H7 Z" fill="url(#sn-metal)" stroke="#4a5058" stroke-width=".8"/>
  <circle cx="28" cy="42" r="5" fill="url(#sn-metal-h)" stroke="#4a5058" stroke-width=".7"/>
  <circle cx="28" cy="42" r="1.8" fill="#8c9298"/>
  <circle cx="16" cy="42" r="2.2" fill="none" stroke="#4a5058" stroke-width=".7"/>
  <circle cx="40" cy="42" r="2.2" fill="none" stroke="#4a5058" stroke-width=".7"/>

  <!-- 목(사다리꼴 받침) + 볼트 -->
  <path d="M10 33 L14 25 H42 L46 33 Z" fill="url(#sn-metal-h)" stroke="#4a5058" stroke-width=".8"/>
  <circle cx="16" cy="28.5" r="1.2" fill="#5a6068"/>
  <circle cx="40" cy="28.5" r="1.2" fill="#5a6068"/>

  <!-- 단자함 -->
  <rect x="38" y="7" width="11" height="13" rx="1.5" fill="#151618" stroke="#000" stroke-width=".7"/>
  <path d="M41 10 L46 15 M46 10 L41 15" stroke="#3b3e43" stroke-width=".8"/>
  <path d="M43.5 20 V25" stroke="#1d1f22" stroke-width="2"/>

  <!-- 검은 원통 코일 -->
  <path d="M14 6 V24 A13 3 0 0 0 40 24 V6 Z" fill="url(#sn-coil)" stroke="#000" stroke-width=".8"/>
  <ellipse cx="27" cy="6" rx="13" ry="3" fill="#2a2c30" stroke="#000" stroke-width=".8"/>
  <!-- 가운데 은색 꼭지 -->
  <rect x="24.5" y="2" width="5" height="4" rx="1" fill="url(#sn-metal-h)" stroke="#4a5058" stroke-width=".5"/>
  <ellipse cx="27" cy="2.3" rx="2.5" ry=".9" fill="#e6e9ec"/>
</svg>
