<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 44" width="40" height="44">
  <!-- 경광등. 원본 alarm-10.png(40x44)의 픽셀 배치를 옮긴 것.

       viewBox가 칸(40x44)과 같다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표:
         돔   x 0~38.6, y 0~37.5
              위쪽 y 0~19 는 반타원(가로반지름 19.3, 세로반지름 19),
              아래 y 19~37.5 는 곧은 통
         받침 x 0~39.5, y 38~43.5

       빛은 왼쪽에서 든다 — 돔 왼쪽 가장자리(x 0~4)가 흰 띠고 오른쪽(x 33~38)이
       어두운 붉은색이다. 받침도 왼쪽이 밝고 오른쪽으로 갈수록 검다.
       양쪽을 반대로 주면 옆 설비들과 빛 방향이 어긋나 붕 떠 보인다. -->
  <defs>
    <!-- 돔: 왼쪽 흰 반사 → 붉은 몸통 → 오른쪽 그늘 -->
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".1" stop-color="#ff9a9a"/>
      <stop offset=".22" stop-color="#ef2a2a"/>
      <stop offset=".6" stop-color="#e01c1c"/>
      <stop offset=".84" stop-color="#b41216"/>
      <stop offset="1" stop-color="#8d0d12"/>
    </linearGradient>
    <!-- 받침: 왼쪽이 밝고 오른쪽 끝이 검다 -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset=".24" stop-color="#d0d0d0"/>
      <stop offset=".5" stop-color="#8e8e8e"/>
      <stop offset=".75" stop-color="#4c4c4c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <!-- 돔 -->
  <path d="M0 37.6 V19.3 A19.3 19.3 0 0 1 38.6 19.3 V37.6 Z" fill="url(#dome)"/>

  <!-- 돔 안쪽 반사 — 유리처럼 보이게 하는 세로 빛줄기 하나.
       여러 줄 넣으면 40px로 줄었을 때 얼룩으로 뭉친다. -->
  <path d="M7.4 35 V19.6 A11.9 11.9 0 0 1 13.4 9.4 L15.6 12.2
           A9 9 0 0 0 11.4 19.8 V35 Z"
        fill="#ffffff" opacity=".34"/>

  <!-- 받침 -->
  <rect x="0" y="37.8" width="39.6" height="5.9" fill="url(#base)"/>
</svg>
