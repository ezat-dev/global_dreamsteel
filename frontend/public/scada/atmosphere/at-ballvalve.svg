<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 48" width="124" height="48">
  <!-- 레버식 볼밸브(발생기 쪽). 원본 valve-20.png(124x48)의 픽셀 배치를 옮긴 것.
       한 자리에만 쓴다 — valve-2.

       viewBox가 칸(124x48)과 같다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표:
         레버       x  4~72,  y  3~7.5   (가는 막대. 가운데에 밝은 줄이 지난다)
         힌지       x 70~88,  y  3~16    (레버에서 스템으로 비스듬히 내려간다)
         스템 캡    x 88~100, y  3~14
         넥         x 78~104, y  9~16
         보닛       x 80~116, y 15~19.5
         본체       x 48~122, y 19~40.5  (가로 원통)
         명판       x 70~92,  y 24~34
         오른쪽 플랜지 x 106~122
         아래 탭    x 106~114, y 40.5~44.5

       레버가 화면 왼쪽 위로 길게 뻗는 것이 이 밸브를 알아보게 하는 부분이다.
       짧게 자르면 그냥 배관 토막이 된다. -->
  <defs>
    <!-- 가로로 누운 원통: 위아래가 어둡고 가운데가 밝다 -->
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e7e7e"/>
      <stop offset=".22" stop-color="#c2c2c2"/>
      <stop offset=".44" stop-color="#f2f2f2"/>
      <stop offset=".72" stop-color="#c0c0c0"/>
      <stop offset="1" stop-color="#767676"/>
    </linearGradient>
    <!-- 레버는 가는 봉이라 같은 규칙을 더 좁은 폭에 준다 -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset=".42" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#7c7c7c"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4c4c"/>
      <stop offset=".45" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset=".45" stop-color="#d0d0d0"/>
      <stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
  </defs>

  <!-- 본체와 오른쪽 플랜지 -->
  <rect x="48" y="19" width="74" height="21.6" fill="url(#barrel)" stroke="#5c5c5c" stroke-width="1"/>
  <rect x="106" y="18.4" width="16" height="22.8" rx=".8" fill="url(#barrel)" stroke="#5c5c5c" stroke-width="1"/>
  <!-- 아래 탭 -->
  <rect x="106" y="40.4" width="8.4" height="4.2" fill="url(#plate)" stroke="#5c5c5c" stroke-width=".9"/>

  <!-- 명판 -->
  <rect x="70" y="24" width="22" height="10" fill="url(#plate)" stroke="#6a6a6a" stroke-width="1"/>

  <!-- 보닛 -->
  <rect x="80" y="15" width="36" height="4.6" rx=".8" fill="url(#barrel)" stroke="#5c5c5c" stroke-width=".9"/>

  <!-- 넥과 스템 캡 -->
  <rect x="78" y="9" width="26" height="7" rx="1" fill="url(#dark)"/>
  <rect x="88" y="3" width="12" height="11" rx="1" fill="url(#dark)"/>

  <!-- 힌지 — 레버에서 스템으로 비스듬히 내려간다 -->
  <path d="M69 3 H76 L88 13 V16 H80 L69 7.5 Z" fill="url(#dark)"/>

  <!-- 레버 -->
  <rect x="4" y="3" width="66" height="4.6" rx="1.4" fill="url(#bar)" stroke="#5c5c5c" stroke-width=".9"/>
</svg>
