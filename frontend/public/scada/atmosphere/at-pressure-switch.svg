<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 76" width="44" height="76">
  <!-- 질소발생기 압력 스위치 — 현장 사진(2026-11-26)을 옮긴 것. 위에서 아래로:
         투명 뚜껑      y  2~13   (안이 비치는 연회색 반투명 상자)
         검은 본체      y 13~29   (가운데 흰 명판)
         은색 받침판    y 29~38   (가운데 둥근 보스·볼트, 양옆 작은 구멍)
         황동 니플      y 38~50
         레버식 볼밸브  y 50~62   (주황 레버가 왼쪽으로 눕는다)
         황동 이음      y 62~76   (아래끝이 회색 세로관 윗끝에 얹힌다)
       눈금판이 없는 압력 스위치다 — 바늘 압력계로 그리면 다른 물건이 된다. -->
  <defs>
    <linearGradient id="ps-cover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ad" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#eef2f6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#8d96a0" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="ps-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111"/>
      <stop offset=".4" stop-color="#3a3d42"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="ps-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d838a"/>
      <stop offset=".45" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#6c727a"/>
    </linearGradient>
    <linearGradient id="ps-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a22"/>
      <stop offset=".45" stop-color="#f1d483"/>
      <stop offset="1" stop-color="#7a5c1a"/>
    </linearGradient>
  </defs>

  <!-- 투명 뚜껑 -->
  <rect x="3" y="2" width="38" height="12" rx="3" fill="url(#ps-cover)" stroke="#5b636c" stroke-width=".8"/>
  <rect x="8" y="5" width="20" height="5" rx="1" fill="#2a2d31" opacity=".55"/>

  <!-- 검은 본체 + 명판 -->
  <rect x="2" y="13" width="40" height="16" rx="1.5" fill="url(#ps-body)" stroke="#000" stroke-width=".8"/>
  <rect x="21" y="18" width="15" height="5" rx="1" fill="#f4f4f4" stroke="#999" stroke-width=".4"/>
  <rect x="22.5" y="19.5" width="3" height="2" fill="#333"/>

  <!-- 은색 받침판 -->
  <path d="M4 29 H40 V35 L36 38 H8 L4 35 Z" fill="url(#ps-metal)" stroke="#4f555c" stroke-width=".8"/>
  <circle cx="8" cy="33" r="1.3" fill="#3c4046"/>
  <circle cx="36" cy="33" r="1.3" fill="#3c4046"/>
  <!-- 가운데 보스와 볼트 -->
  <circle cx="22" cy="34" r="6" fill="url(#ps-metal)" stroke="#4f555c" stroke-width=".8"/>
  <circle cx="22" cy="34" r="2.6" fill="#9ca2a9" stroke="#4f555c" stroke-width=".6"/>

  <!-- 황동 니플(육각 + 관) -->
  <rect x="16" y="39" width="12" height="4" fill="url(#ps-brass)" stroke="#5c4512" stroke-width=".6"/>
  <rect x="18" y="43" width="8" height="7" fill="url(#ps-brass)" stroke="#5c4512" stroke-width=".6"/>

  <!-- 볼밸브 몸통 + 주황 레버 -->
  <rect x="15" y="50" width="14" height="12" rx="1.5" fill="url(#ps-brass)" stroke="#5c4512" stroke-width=".7"/>
  <rect x="19" y="48" width="6" height="3" fill="#b7bcc2" stroke="#555" stroke-width=".5"/>
  <path d="M1 49.5 H22 V53 H1 Z" fill="#ff6a1a" stroke="#a63b00" stroke-width=".7"/>
  <circle cx="22" cy="51" r="1.8" fill="#d0d4d8" stroke="#555" stroke-width=".5"/>

  <!-- 아래 황동 이음 -->
  <rect x="17" y="62" width="10" height="5" fill="url(#ps-brass)" stroke="#5c4512" stroke-width=".6"/>
  <rect x="15" y="67" width="14" height="9" fill="url(#ps-brass)" stroke="#5c4512" stroke-width=".6"/>
</svg>
