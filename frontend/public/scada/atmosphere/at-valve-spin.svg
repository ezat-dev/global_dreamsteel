<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 43" width="50" height="43">
  <!-- ADDTION 컨트롤 밸브 (디스크가 도는 판). 원본 valve-10.png(50x43) 기준.

       정지판이 at-valve.svg 다. 도형은 똑같고 디스크가 도는 것만 다르다 —
       나중에 태그를 받으면 값이 1일 때 이 파일, 0일 때 정지판으로 src 만 갈아끼우면 된다.
       모양을 고칠 일이 생기면 두 파일을 같이 고쳐야 한다.

       연소화면 존 밸브(combustion/obj-valve-wide.svg)와 같은 기기다 — 좌우 원뿔 사이에
       4분할 디스크가 달린 버터플라이 밸브. 그림체(원뿔 음영, 디스크 배색, 선 두께)를
       그쪽과 맞췄다. 다만 배치가 다르다:
         연소화면 — 배관이 가로(원뿔이 좌우), 받침이 아래
         여기     — 배관이 세로(원뿔이 위아래), 구동부가 오른쪽
       그래서 도형을 돌려 쓰지 않고 이 자리 좌표로 다시 그렸다.

       viewBox가 칸(50x43)과 같다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표:
         위 원뿔   바깥 y 1 (x 1~35.4),  안쪽 y 12 (x 8~29.4)
         아래 원뿔 안쪽 y 31 (x 8~29.4), 바깥 y 41.4 (x 1~35.4)
         디스크    x 10~30, y 12~30  (가운데 세로 축 x 18)
         축        x 29~40, y 19.6~22.4
         구동부    x 39~49.5, y 6~35.5

       디스크 배색이 연소화면과 대각선으로 반대다(여기는 왼위 초록, 오른위 노랑).
       원본이 그렇다 — 배관이 세로로 놓이면서 같은 디스크가 돌아간 것이다. -->
  <defs>
    <!-- 원뿔: 배관이 세로라 음영도 가로로 흐른다(왼쪽 어둡고 가운데 밝게) -->
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset=".38" stop-color="#e4e4e4"/>
      <stop offset=".62" stop-color="#b4b4b4"/>
      <stop offset="1" stop-color="#5c5c5c"/>
    </linearGradient>
    <linearGradient id="act" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset=".35" stop-color="#c8c8c8"/>
      <stop offset=".7" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#5e5e5e"/>
    </linearGradient>
    <!-- 디스크 4분할. 연소화면 밸브와 같은 색이다. -->
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9c14"/>
      <stop offset=".55" stop-color="#5fd62c"/>
      <stop offset="1" stop-color="#8ff05e"/>
    </linearGradient>
    <linearGradient id="ylw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98b0c"/>
      <stop offset=".55" stop-color="#f5c22a"/>
      <stop offset="1" stop-color="#ffe08f"/>
    </linearGradient>
    <clipPath id="disc">
      <ellipse cx="19.8" cy="21" rx="9.8" ry="9"/>
    </clipPath>
  </defs>

  <!-- 선은 얇게. 50px 칸으로 줄여 그리므로 굵으면 만화처럼 보인다
       (연소화면 밸브와 같은 .9). -->
  <g stroke="#232323" stroke-width=".9" stroke-linejoin="round">
    <!-- 위·아래 원뿔 — 바깥이 넓고 가운데로 갈수록 좁아진다 -->
    <path d="M1.4 1.4 H35.4 L29.4 12.2 H8 Z" fill="url(#cone)"/>
    <path d="M8 30.8 H29.4 L35.4 41.6 H1.4 Z" fill="url(#cone)"/>

    <!-- 구동부로 이어지는 축 -->
    <rect x="29" y="19.6" width="11" height="2.8" fill="#8f8f8f"/>
    <!-- 구동부 -->
    <rect x="39" y="6" width="10.6" height="29.6" rx="1.4" fill="url(#act)"/>
  </g>

  <!-- 디스크 — 4분할과 가운데 축이 함께 돈다.
       사분면을 디스크보다 크게(14x14) 잡은 이유: 디스크에 딱 맞춰 그리면 45도쯤
       돌았을 때 네 귀퉁이가 원 밖으로 밀려 안쪽에 빈 곳이 생긴다. 크게 깔고
       clip-path 로 잘라내면 어느 각도에서도 원이 꽉 찬다.
       테두리는 밖에 두어 돌지 않는다 — 같이 돌면 테두리가 떨리는 것처럼 보인다. -->
  <g clip-path="url(#disc)">
    <g>
      <rect x="5.8" y="7" width="14" height="14" fill="url(#grn)"/>
      <rect x="19.8" y="7" width="14" height="14" fill="url(#ylw)"/>
      <rect x="5.8" y="21" width="14" height="14" fill="url(#ylw)"/>
      <rect x="19.8" y="21" width="14" height="14" fill="url(#grn)"/>
      <!-- 가운데 축 -->
      <rect x="18.9" y="9" width="1.8" height="24" fill="#1d1d1d"/>

      <!-- 회전. 3초에 한 바퀴 — 더 빠르면 값이 아니라 경보처럼 보인다.
           linear 라야 멈칫하지 않는다. 도는 중심 (19.8, 21)은 디스크 가운데다. -->
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                        from="0 19.8 21" to="360 19.8 21" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- 테두리 (돌지 않는다) -->
  <ellipse cx="19.8" cy="21" rx="9.8" ry="9" fill="none" stroke="#232323" stroke-width="1.1"/>
</svg>
