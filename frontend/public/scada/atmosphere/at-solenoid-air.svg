<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -1 79 54" width="79" height="54">
  <!-- ADDTION BLOWE(공기) 솔레노이드 밸브. 원본 blowe-sol0.png(79x54).
       가스 쪽 at-solenoid-gas.svg와 같은 기기다 — 도형은 그대로 두고 색만 은색으로 갈았다.
       모양을 고칠 일이 생기면 두 파일을 같이 고쳐야 한다.

       칸이 79x54라 viewBox를 그만큼 넓혀 같은 그림을 가운데 두었다.
       CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표: 코일 갓 x 8~70, y 0~19    목 x 20~58, y 20~27
                  검은 띠 x 32~46, y 27~29
                  본체 y 30~52 — 좌 플랜지 x 0~11, 강관 x 12~24, 가운데 x 24~55,
                                 강관 x 55~66, 우 플랜지 x 66~78 -->
  <defs>
    <!-- 위아래가 어둡고 가운데가 밝은 원통 음영. 배관·밸브 그림과 같은 규칙이다. -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e878e"/>
      <stop offset=".3" stop-color="#b9c1c8"/>
      <stop offset=".55" stop-color="#eef2f5"/>
      <stop offset=".8" stop-color="#b9c1c8"/>
      <stop offset="1" stop-color="#767f86"/>
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde3e8"/>
      <stop offset=".45" stop-color="#b4bcc3"/>
      <stop offset="1" stop-color="#7e878e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6367"/>
      <stop offset=".45" stop-color="#9aa0a4"/>
      <stop offset="1" stop-color="#55595d"/>
    </linearGradient>
  </defs>

  <g stroke="#6b7278" stroke-width=".8" stroke-linejoin="round">
    <!-- 코일 갓 -->
    <ellipse cx="39" cy="9" rx="30.6" ry="8.6" fill="url(#coil)"/>
    <rect x="10" y="12.4" width="58" height="6.6" rx="2.6" fill="url(#coil)"/>
    <!-- 목 -->
    <rect x="20.4" y="19.6" width="37.2" height="7.8" rx="1.6" fill="url(#body)"/>
  </g>

  <!-- 목 아래 검은 띠 -->
  <rect x="31.6" y="27.2" width="14.8" height="2.6" fill="url(#steel)" stroke="#2b2e31" stroke-width=".7"/>

  <g stroke="#6b7278" stroke-width=".8" stroke-linejoin="round">
    <!-- 강관 두 토막 (플랜지와 본체 사이) -->
    <rect x="11.6" y="35.4" width="12.6" height="9.6" fill="url(#steel)" stroke="#4a4e51"/>
    <rect x="54.8" y="35.4" width="11.4" height="9.6" fill="url(#steel)" stroke="#4a4e51"/>
    <!-- 좌우 플랜지 -->
    <rect x=".4" y="30" width="11.2" height="21.6" rx="1" fill="url(#body)"/>
    <rect x="66.2" y="30" width="11.4" height="21.6" rx="1" fill="url(#body)"/>
    <!-- 가운데 본체 -->
    <rect x="24" y="29.8" width="31" height="22" rx="1.6" fill="url(#body)"/>
  </g>
</svg>
