<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.2 2.5 17.6 135" width="17.6" height="135">
  <!-- 컨베이어 롤러 (출구용). 원본 ent-conv-10.png(18x138)의 픽셀 배치를 옮긴 것.
       18자리에 쓴다 — ent-conv-1~12, exit-conv-1~6.
       (exit-conv-*는 작화 CSS가 scale(-1,1)로 좌우를 뒤집어 쓴다. 명암이 가운데에서
        조금 오른쪽에 있어 뒤집으면 왼쪽으로 가는데, 폭이 18px이라 티가 나지 않는다.)

       viewBox는 원본의 내용 영역에 맞추고 칸(18x138)의 비율에 맞췄다.
       CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표: 위 축 x 5~12.5, y 3~11    몸통 x 0.5~17.3, y 10.5~128.5
                  아래 축 x 5~13, y 128~137

       명암은 원본 가로 단면(y=70)의 밝기를 그대로 옮겼다. 양 끝이 검고 가운데보다
       조금 오른쪽(58%)이 가장 밝다 — 쇠 롤러가 빛을 받는 모습이다. -->
  <defs>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset=".08" stop-color="#1b1b1b"/>
      <stop offset=".22" stop-color="#575757"/>
      <stop offset=".38" stop-color="#939393"/>
      <stop offset=".5" stop-color="#cfcfcf"/>
      <stop offset=".58" stop-color="#f3f3f3"/>
      <stop offset=".7" stop-color="#b7b7b7"/>
      <stop offset=".84" stop-color="#7b7b7b"/>
      <stop offset=".94" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <!-- 축은 몸통보다 어둡다 -->
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141414"/>
      <stop offset=".3" stop-color="#5e5e5e"/>
      <stop offset=".56" stop-color="#a8a8a8"/>
      <stop offset=".8" stop-color="#565656"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <clipPath id="barrelClip">
      <rect x="0.5" y="10.4" width="16.9" height="118.2"/>
    </clipPath>
  </defs>

  <style>
    /* 한 바퀴에 4 만큼만 민다 — 자국 간격과 같아야 이어 붙는다.
       linear 이어야 멈칫하지 않는다(ease 를 쓰면 매번 끊기는 느낌이 난다).

       +4 인 것이 입구용(roller.svg)과 다른 유일한 부분이다.
       출구 롤러는 작화 CSS가 scale(-1,1)로 좌우를 뒤집어 그리므로, 파일 안에서
       오른쪽으로 흘려야 화면에서는 왼쪽으로 흐른다. 입구와 같은 -4를 주면
       화면에서 반대로 돈다. */
    .roll { animation: roller-spin 1.1s linear infinite; }
    @keyframes roller-spin { to { transform: translateX(4px); } }

    /* 움직임을 꺼 달라는 설정이면 멈춘다. 현장 패널에서 18개가 계속 도는 게
       거슬린다는 사람도 있어서, 그 설정을 존중한다. */
    @media (prefers-reduced-motion: reduce) {
      .roll { animation: none; }
    }
  </style>

  <!-- 위·아래 축 (몸통보다 먼저 그려 아래로 깔린다) -->
  <rect x="5" y="2.8" width="7.6" height="10" fill="url(#shaft)"/>
  <rect x="5" y="126" width="7.9" height="11.2" fill="url(#shaft)"/>

  <!-- 몸통 -->
  <rect x="0.5" y="10.4" width="16.9" height="118.2" fill="url(#barrel)"/>

  <!-- 도는 것처럼 보이게 하는 표면 자국.
       매끈한 쇠 원통은 돌려도 티가 안 난다 — 명암(하이라이트)은 빛이 만드는 것이라
       제자리에 있기 때문이다. 그래서 표면에 옅은 세로 자국을 깔고 그것만 옆으로 흘린다.

       이음매 없이 돌리는 요령: 자국 간격(4)만큼만 밀고 처음으로 돌아간다.
       그래서 자국을 몸통 밖(-4 ~ 21)까지 깔아 두어야 민 뒤에도 빈 곳이 생기지 않는다.
       clip-path 로 몸통 밖은 잘라낸다.

       진하기(opacity .26 / .2)는 실제 크기 18px에서 겨우 보이는 선으로 맞춘 값이다.
       더 진하게 하면 쇠가 아니라 줄무늬 천처럼 보이고, 더 옅으면 도는지 알 수 없다.

       매쉬 롤러(roller-mesh.svg)는 이 움직임을 넣지 않는다 — 제품 감지 자리라 돌지 않는다.
       입구용은 roller.svg 다(자국 흐르는 부호만 다르다). 자국 모양이나 속도를 고치면
       두 파일을 같이 고쳐야 한다. -->
  <g clip-path="url(#barrelClip)">
    <g class="roll">
      <path d="M-4.0 10.4 V128.6 M0.0 10.4 V128.6 M4.0 10.4 V128.6 M8.0 10.4 V128.6 M12.0 10.4 V128.6 M16.0 10.4 V128.6 M20.0 10.4 V128.6" stroke="#ffffff" stroke-width="1.2" opacity=".26"/>
      <path d="M-4.0 10.4 V128.6 M0.0 10.4 V128.6 M4.0 10.4 V128.6 M8.0 10.4 V128.6 M12.0 10.4 V128.6 M16.0 10.4 V128.6 M20.0 10.4 V128.6" transform="translate(1.6 0)" stroke="#000000" stroke-width="1" opacity=".2"/>
    </g>
  </g>
</svg>
