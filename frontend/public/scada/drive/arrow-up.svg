<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.475 1 19 39" width="19" height="39">
  <!-- 위 방향 화살표. 원본 ent-up-10.png(20x41)의 픽셀 배치를 옮긴 것.
       8자리에 쓴다 — ent-up-1~4, exit-up-1~4.
       (exit-up-*는 작화 CSS가 scale(-1,1)로 좌우를 뒤집어 쓴다. 화살표는 좌우 대칭이라
        뒤집혀도 같아 보이고, 명암만 반대쪽으로 간다.)

       viewBox는 원본의 내용 영역에 가로 여백을 조금 더해 칸(20x41)의 비율에 맞췄다.
       CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표: 머리 꼭짓점 (9.5, 1)  머리 밑변 x 1~18, y 20.6
                  자루 x 4~13.5, y 20.6~39

       ── 자루 위치를 원본에서 고쳤다 ──
       원본은 자루가 머리 가운데(9.5)에서 1px 왼쪽으로 치우쳐 있었다(자루 가운데 8.75).
       위·아래 화살표가 한 쌍으로 붙는 자리라 이게 그대로 어긋나 보인다.
       그래서 자루를 머리와 같은 중심(9.5)에 맞췄다 — x 4.85~14.15.

       viewBox의 x(0.475)도 어림값이 아니다. 이 칸은 20px이고 아래 화살표 칸은 21px,
       left 도 80과 79로 다르다. 두 화살표의 자루가 화면에서 같은 x에 오려면
       위쪽은 칸 왼쪽에서 9.5px, 아래쪽은 10.5px 자리에 자루 가운데가 와야 한다
       (80+9.5 = 79+10.5 = 89.5). 그 조건을 viewBox로 되돌려 푼 값이다:
         (9.5 - x) / 19 = 9.5 / 20  →  x = 0.475
       칸 크기나 left가 바뀌면 이 값도 다시 계산해야 한다. -->
  <defs>
    <!-- 왼쪽이 밝고 오른쪽이 어둡다(원본이 그렇다). 색은 원본에서 뽑은 값이다 —
         모터의 형광 초록과 달리 이 화살표는 가라앉은 숲 초록이다. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6aa96b"/>
      <stop offset=".28" stop-color="#2b8a2c"/>
      <stop offset=".62" stop-color="#117512"/>
      <stop offset="1" stop-color="#0c5a0d"/>
    </linearGradient>
  </defs>

  <path d="M9.5 1.2 L17.9 20.6 L14.15 20.6 L14.15 39 L4.85 39 L4.85 20.6 L1.1 20.6 Z"
        fill="url(#g)" stroke="#0a4f0b" stroke-width=".6" stroke-linejoin="round"/>
</svg>
