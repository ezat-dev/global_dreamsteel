<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.2 2.5 17.6 135" width="17.6" height="135">
  <!-- 입구 롤러 줄 맨 끝의 매쉬 롤러(제품 감지 자리).
       한 자리에만 쓴다 — DrivePage 의 END_ROLLER.

       크기·자리는 옆 롤러(roller.svg)와 같게 맞췄다. 같은 줄에 서는 것이라 viewBox와
       칸(18x138)을 그대로 따른다. 다른 점은 겉면이 매끈한 쇠가 아니라 매쉬라는 것뿐이다.

       매쉬는 <pattern> 으로 그린다. userSpaceOnUse 라 그림이 줄어들 때 무늬도 같이
       줄어든다 — objectBoundingBox 로 두면 칸 비율이 바뀔 때 무늬가 늘어나 찌그러진다.
       격자 간격 2.6은 이 폭(17.6)에서 대각선이 예닐곱 줄 지나가는 값이다.
       더 촘촘하면 화면에서 줄어들 때 회색 덩어리로 뭉친다. -->
  <defs>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset=".12" stop-color="#6d6d6d"/>
      <stop offset=".42" stop-color="#c9c9c9"/>
      <stop offset=".58" stop-color="#e4e4e4"/>
      <stop offset=".8" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#2f2f2f"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141414"/>
      <stop offset=".3" stop-color="#5e5e5e"/>
      <stop offset=".56" stop-color="#a8a8a8"/>
      <stop offset=".8" stop-color="#565656"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>

    <!-- 매쉬 — 대각선 두 방향을 겹쳐 그물눈을 만든다 -->
    <pattern id="mesh" patternUnits="userSpaceOnUse" width="2.6" height="2.6">
      <path d="M0 2.6 L2.6 0 M-0.65 0.65 L0.65 -0.65 M1.95 2.6 L2.6 1.95"
            stroke="#3a3a3a" stroke-width=".55"/>
      <path d="M0 0 L2.6 2.6 M-0.65 1.95 L0.65 2.6 M1.95 0 L2.6 0.65"
            stroke="#3a3a3a" stroke-width=".55"/>
    </pattern>
  </defs>

  <!-- 위·아래 축 (몸통보다 먼저 그려 아래로 깔린다) -->
  <rect x="5" y="2.8" width="7.6" height="10" fill="url(#shaft)"/>
  <rect x="5" y="126" width="7.9" height="11.2" fill="url(#shaft)"/>

  <!-- 몸통 — 쇠 음영 위에 매쉬를 얹는다 -->
  <rect x="0.5" y="10.4" width="16.9" height="118.2" fill="url(#barrel)"/>
  <rect x="0.5" y="10.4" width="16.9" height="118.2" fill="url(#mesh)" opacity=".85"/>
  <rect x="0.5" y="10.4" width="16.9" height="118.2" fill="none"
        stroke="#1e1e1e" stroke-width="1.2"/>

  <!-- 위·아래 테두리 띠 — 매쉬가 끝나는 자리를 눈에 잡히게 한다 -->
  <g fill="#1e1e1e">
    <rect x="0.5" y="10.4" width="16.9" height="3.4"/>
    <rect x="0.5" y="125.2" width="16.9" height="3.4"/>
  </g>
</svg>
