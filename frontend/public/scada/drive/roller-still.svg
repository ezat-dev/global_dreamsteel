<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.2 2.5 17.6 135" width="17.6" height="135">
  <!-- 멈춘 컨베이어 롤러. roller.svg 와 그림이 완전히 같고 표면 자국을 흘리는
       애니메이션만 없다. 태그 값이 0이거나 PLC 값을 못 읽을 때 이 파일로 바꿔 끼운다
       (DriveOverview 의 entRolling / exitRolling).

       입구·출구가 이 파일 하나를 같이 쓴다. roller.svg 와 roller-exit.svg 는 자국이
       흐르는 부호(-4 / +4)만 다른데, 멈추면 그 차이가 사라지기 때문이다.

       <img> 로 띄운 SVG 안의 애니메이션은 바깥 CSS로 멈출 수 없다. 그래서 클래스를
       붙이는 방식(화살표가 쓰는 방식)이 아니라 파일을 바꿔 끼우는 방식을 쓴다.

       그림 부분은 roller.svg 에서 그대로 옮긴 것이다 — 모양·명암·자국을 고치면
       roller.svg / roller-exit.svg / 이 파일 셋을 같이 고쳐야 한다. -->
  <defs>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset=".08" stop-color="#1b1b1b"/>
      <stop offset=".22" stop-color="#575757"/>
      <stop offset=".38" stop-color="#939393"/>
      <stop offset=".5" stop-color="#cfcfcf"/>
      <stop offset=".58" stop-color="#f3f3f3"/>
      <stop offset=".7" stop-color="#b7b7b7"/>
      <stop offset=".84" stop-color="#7b7b7b"/>
      <stop offset=".94" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <!-- 축은 몸통보다 어둡다 -->
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141414"/>
      <stop offset=".3" stop-color="#5e5e5e"/>
      <stop offset=".56" stop-color="#a8a8a8"/>
      <stop offset=".8" stop-color="#565656"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <clipPath id="barrelClip">
      <rect x="0.5" y="10.4" width="16.9" height="118.2"/>
    </clipPath>
  </defs>

  <!-- 위·아래 축 (몸통보다 먼저 그려 아래로 깔린다) -->
  <rect x="5" y="2.8" width="7.6" height="10" fill="url(#shaft)"/>
  <rect x="5" y="126" width="7.9" height="11.2" fill="url(#shaft)"/>

  <!-- 몸통 -->
  <rect x="0.5" y="10.4" width="16.9" height="118.2" fill="url(#barrel)"/>

  <!-- 표면 자국. 도는 파일과 자리를 똑같이 맞춰 두어야 멈출 때 무늬가 튀지 않는다. -->
  <g clip-path="url(#barrelClip)">
    <g>
      <path d="M-4.0 10.4 V128.6 M0.0 10.4 V128.6 M4.0 10.4 V128.6 M8.0 10.4 V128.6 M12.0 10.4 V128.6 M16.0 10.4 V128.6 M20.0 10.4 V128.6" stroke="#ffffff" stroke-width="1.2" opacity=".26"/>
      <path d="M-4.0 10.4 V128.6 M0.0 10.4 V128.6 M4.0 10.4 V128.6 M8.0 10.4 V128.6 M12.0 10.4 V128.6 M16.0 10.4 V128.6 M20.0 10.4 V128.6" transform="translate(1.6 0)" stroke="#000000" stroke-width="1" opacity=".2"/>
    </g>
  </g>
</svg>
