<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2.2 54 28" width="54" height="28">
  <!-- 가로 기어드 모터. 원본 exit-motor-40.png(60x33)의 픽셀 배치를 옮긴 것.
       11개 모터 중 4자리에 쓴다 — ent-motor-1 / exit-motor-1 / exit-motor-2 / exit-motor-4.
       (exit-motor-4는 작화 CSS가 scale(-1,1)로 좌우를 뒤집어 쓴다.)

       viewBox는 원본의 내용 영역에 맞추고 세로만 조금 늘려 칸(56x29)의 비율에 맞췄다.
       CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표: 모터 본체 x 3~31, y 8~27   가운데 칼라 x 30~36, y 11~26
                  감속기 x 36~50, y 5~28     팬 커버 x 31~50, y 3~8
                  출력축 x 50~57, y 17~21 -->
  <defs>
    <!-- 원통 음영: 위아래가 어둡고 가운데가 밝다. 배관 그림과 같은 규칙이다. -->
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#146414"/>
      <stop offset=".18" stop-color="#0dc30d"/>
      <stop offset=".48" stop-color="#3bff3b"/>
      <stop offset=".8" stop-color="#0db80d"/>
      <stop offset="1" stop-color="#125c12"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0aa80a"/>
      <stop offset=".55" stop-color="#2bf02b"/>
      <stop offset="1" stop-color="#147014"/>
    </linearGradient>
  </defs>

  <g stroke="#0f4f0f" stroke-width=".8" stroke-linejoin="round">
    <!-- 출력축 -->
    <rect x="49" y="17" width="7.6" height="4.2" rx=".6" fill="url(#barrel)"/>

    <!-- 팬 커버 — 감속기 위에 얹힌 덮개 -->
    <path d="M33.4 7.6 L35.6 3 H48.4 L50.2 7.6 Z" fill="url(#barrel)"/>

    <!-- 감속기 -->
    <rect x="35.4" y="6.4" width="14.8" height="21.4" rx="3" fill="url(#barrel)"/>

    <!-- 모터와 감속기를 잇는 칼라 -->
    <rect x="29.6" y="10.8" width="6.2" height="15" rx="1" fill="url(#barrel)"/>

    <!-- 모터 본체 -->
    <rect x="6" y="8.2" width="24.4" height="18.6" rx="1.2" fill="url(#barrel)"/>

    <!-- 왼쪽 끝단 -->
    <ellipse cx="6" cy="17.5" rx="3" ry="9.3" fill="url(#cap)"/>
  </g>

  <!-- 본체 냉각핀(세로 줄)과 감속기 핀(가로 줄).
       선만 얹어 질감을 낸다 — 작은 크기라 홈을 파면 뭉개진다. -->
  <g stroke="#0f5a0f" stroke-width=".7" opacity=".75">
    <path d="M10.5 9 V26 M14 9 V26 M17.5 9 V26 M21 9 V26 M24.5 9 V26 M28 9 V26"/>
  </g>
  <g stroke="#0f5a0f" stroke-width=".7" opacity=".7">
    <path d="M36.4 11 H49.2 M36.4 14.4 H49.2 M36.4 21 H49.2 M36.4 24.4 H49.2"/>
  </g>

  <!-- 본체 가운데 명판 -->
  <rect x="16.4" y="15.2" width="4.6" height="4.6" rx=".8"
        fill="#0aa80a" stroke="#0f4f0f" stroke-width=".7"/>
</svg>
