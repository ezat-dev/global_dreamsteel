<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 구동화면 로(furnace) 순환 팬. DOOR 오른쪽 판에 하나, 쿨링챔버 판에 둘 들어간다.
       (예전에는 그 자리에 PV 값칸 셋이 있었다.)

       ── 모양 ──
       납작한 실루엣이다. 케이싱·음영 없이 날개 4장과 가운데 링만 남겼다 —
       작은 칸(실제 화면에서 한 변 45px 안팎)에서는 음영을 넣어도 안 보이고
       형체만 흐려진다.
       날개는 하나만 그려 두고 90도씩 돌려 네 번 쓴다(use). 한 장만 고치면 넷이 같이 바뀐다.
       가운데는 링(속이 빈 원)이라 뒤에 깔린 설비 색이 그대로 비친다.

       ── 회전 ──
       CSS 애니메이션이다. img로 띄워도 SVG 안의 CSS는 돌고(스크립트만 막힌다),
       움직임을 꺼 달라는 설정(prefers-reduced-motion)도 존중할 수 있다.
       1.2초에 한 바퀴 — 더 빠르면 날개가 겹쳐 보여 떨리는 것처럼 되고, 더 느리면
       돌아가는 느낌이 안 난다.
       transform-box: view-box 라야 회전 중심을 viewBox 좌표(32,32)로 줄 수 있다.
       날개 묶음의 제 경계(fill-box)로 두면 네 장의 바깥 테두리가 중심이 되어 흔들린다.

       ── 색 ──
       작화의 선 색(#232323)과 같은 짙은 회색이다. 이 팬이 얹히는 판(main-obj-1/2)이
       밝은 은색·베이지라 짙은 실루엣이 제일 또렷하다. -->
  <defs>
    <!-- 날개 한 장(위쪽을 향한다).

         사진과 맞추려면 날개가 링을 감싸며 사분면을 거의 채워야 한다. 앞서 원 몇 개를
         겹쳐 만들었을 때는 작은 덩어리 넷이 되어 틈이 너무 넓었다. 그래서 안쪽은
         링을 따라가는 원호로, 바깥은 큰 둥근 끝으로 잡았다.

         자리(가운데 32,32 기준 극좌표):
           안쪽 변  r11,     각 -38도 ~ +30도   (68도를 감싼다 — 틈은 22도만 남는다)
           바깥 끝  r28.5~30, 각 -44도 ~ +6도   (칸(r32) 거의 끝까지 뻗는다)
         날개가 짧아 보이면 링이 큰 것이 원인이다 — 사진의 허브는 아이콘 반지름의 1/4쯤
         이고, 링을 키우면 그만큼 날개가 안쪽에서 잘려 뭉툭해진다. 링 r8.5에 맞춰
         안쪽 변을 r11까지 들였다(날개 길이 19, 허브 8.5).
         바깥 끝의 무게가 안쪽 변보다 왼쪽(반시계)으로 쏠려 있어서 바람개비처럼 휜다 —
         회전이 시계 방향이라 끌려가는 모양이 된다. 좌우 대칭으로 두면 꽃잎이 된다. -->
    <path id="fan-blade"
          d="M37.50 22.47
             C 43.5 15.5 41.0 6.5 34.98 3.66
             C 26.0 0.2 12.5 2.5 11.16 10.42
             C 10.0 16.5 19.0 21.5 25.23 23.33
             A 11 11 0 0 1 37.50 22.47 Z"/>
  </defs>

  <style>
    /* 1.2초에 한 바퀴. 숫자를 줄이면 빨라진다 — 너무 빠르면 날개가 겹쳐 보여
       떨리는 것처럼 되고, 너무 느리면 돌아가는 느낌이 안 난다.
       잠시 멈추고 싶으면 이 animation 줄만 주석으로 막으면 된다. */
    .spin {
      transform-box: view-box;
      transform-origin: 32px 32px;
      animation: fan-turn 1.5s linear infinite;
    }

    @keyframes fan-turn {
      to { transform: rotate(360deg); }
    }

    /* 움직임을 꺼 달라는 설정이면 멈춘다 — 현장 패널에서 계속 도는 것이 거슬린다는
       사람도 있어서 그 설정을 존중한다(작화의 다른 회전 부품과 같은 규칙). */
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; }
    }
  </style>

  <g fill="#232323">
    <!-- 날개 넷 -->
    <g class="spin">
      <use href="#fan-blade"/>
      <use href="#fan-blade" transform="rotate(90 32 32)"/>
      <use href="#fan-blade" transform="rotate(180 32 32)"/>
      <use href="#fan-blade" transform="rotate(270 32 32)"/>
    </g>

    <!-- 가운데 링. 속을 비워 두면(fill: none) 뒤에 깔린 설비 색이 그대로 비쳐서
         받은 사진처럼 가운데가 환하게 뚫린 모양이 된다. 축 점은 두지 않는다 —
         사진에도 없고, 작은 칸에서는 뚫린 가운데가 더 또렷하다.
         돌지 않는다 — 같이 돌면 가운데가 떠는 것처럼 보인다. -->
    <circle cx="32" cy="32" r="8.5" fill="none" stroke="#232323" stroke-width="3"/>
  </g>
</svg>
