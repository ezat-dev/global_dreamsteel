<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.95 0.8 19.9 37" width="19.9" height="37">
  <!-- 아래 방향 화살표. 원본 ent-down-10.png(21x39)의 픽셀 배치를 옮긴 것.
       8자리에 쓴다 — ent-down-1~4, exit-down-1~4.
       (exit-down-*는 작화 CSS가 scale(-1,1)로 좌우를 뒤집어 쓴다.)

       위 화살표를 180도 돌린 것과 같은 그림이지만 파일을 따로 둔다. 돌려 쓰려면
       작화 CSS에 rotate를 넣어야 하는데, 그 CSS는 작화에서 다시 뽑으면 덮어써진다.
       src만 바꾸는 쪽이 안전하다.

       viewBox는 원본의 내용 영역에 가로 여백을 조금 더해 칸(21x39)의 비율에 맞췄다.
       CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표: 자루 x 6~15, y 1~18.6
                  머리 밑변 x 2~19.6, y 18.6   꼭짓점 (10.5, 37.4)

       ── 자루 위치를 원본에서 고쳤다 ──
       원본은 자루·꼭짓점이 머리 가운데(10.9)에서 조금 비껴 있었다. 위 화살표와
       한 쌍으로 붙는 자리라 그대로 두면 어긋나 보인다. 셋 다 10.9에 맞췄다.

       viewBox의 x(0.95)도 어림값이 아니다. 위 화살표 칸은 20px/left 80, 이 칸은
       21px/left 79라, 두 자루가 화면에서 같은 x(89.5)에 오려면 이쪽 자루 가운데가
       칸 왼쪽에서 10.5px 자리에 와야 한다. 그 조건을 viewBox로 되돌려 푼 값이다:
         (10.9 - x) / 19.9 = 10.5 / 21  →  x = 0.95
       칸 크기나 left가 바뀌면 이 값도 다시 계산해야 한다.
       출구 쪽(exit-*)은 CSS가 scale(-1,1)로 뒤집는데, left 가 1643/1644 라
       뒤집힌 뒤에도 같은 x(1633.5)에서 만난다 — 따로 맞출 필요가 없다. -->
  <defs>
    <!-- 위 화살표와 반대로 왼쪽이 어둡고 오른쪽이 밝다. 180도 돌린 그림이라
         명암도 같이 뒤집힌 것이다 — 원본이 그렇게 되어 있다. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c5a0d"/>
      <stop offset=".38" stop-color="#117512"/>
      <stop offset=".72" stop-color="#2b8a2c"/>
      <stop offset="1" stop-color="#6aa96b"/>
    </linearGradient>
  </defs>

  <path d="M10.9 37.4 L2.2 18.6 L6.3 18.6 L6.3 1 L15.5 1 L15.5 18.6 L19.6 18.6 Z"
        fill="url(#g)" stroke="#0a4f0b" stroke-width=".6" stroke-linejoin="round"/>
</svg>
