<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 150" width="330" height="150">
  <!-- 작은 수조(쿨링타워 아래). 원본 obj-20.png(330x95)을 대신한다. 한 자리에만 쓴다 — obj-2.
       큰 수조와 달리 틀과 물이 한 그림에 같이 있다.

       물 색·수면선·깊이 음영은 큰 수조(ct-water.svg)와 같은 규칙으로 맞췄다.
       둘이 같은 물이라 색이 다르면 한 화면에서 따로 논다 — 한쪽을 고치면 같이 고칠 것.

       viewBox가 칸(330x150)과 같다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       높이를 원본 95에서 150으로 55 늘렸다(2026-10) — 위에 있던 아래 화살표 셋(arrow-3~5)을
       빼고, 수조 윗끝을 쿨링타워(obj-1) 하부 빔 아래에 붙였다. 바닥 위치는 그대로라
       오른쪽 출구 배관과의 이음은 바뀌지 않는다. 늘린 것은 기둥·물 높이뿐이고
       수면선·받침 두께는 원본 그대로다.

       원본 좌표(늘린 뒤): 왼 기둥 x 16~28, 오른 기둥 x 304~316, 둘 다 y 4~139
                            물 x 28~304, y 6~139
                            받침 x 4~328, y 139~146 -->
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9df0ff"/>
      <stop offset=".06" stop-color="#3ad8ff"/>
      <stop offset=".35" stop-color="#00ccff"/>
      <stop offset=".72" stop-color="#00b2e8"/>
      <stop offset="1" stop-color="#0088c0"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05585c"/>
      <stop offset=".35" stop-color="#12969a"/>
      <stop offset=".62" stop-color="#0c7a7e"/>
      <stop offset="1" stop-color="#054a4e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12969a"/>
      <stop offset=".4" stop-color="#0c7a7e"/>
      <stop offset="1" stop-color="#054a4e"/>
    </linearGradient>
  </defs>

  <!-- 물 (기둥보다 먼저 그려 뒤로 깔린다). 옅은 반사 두 줄은 물 높이에 비례해 내렸다(원래 y 24 / 52) -->
  <rect x="28" y="6" width="276" height="133" fill="url(#deep)"/>
  <rect x="28" y="6" width="276" height="2.6" fill="#d6faff" opacity=".85"/>
  <rect x="28" y="8.6" width="276" height="1.6" fill="#7ee8ff" opacity=".6"/>
  <rect x="28" y="38" width="276" height="4" fill="#ffffff" opacity=".13"/>
  <rect x="28" y="85" width="276" height="2.4" fill="#ffffff" opacity=".08"/>

  <g stroke="#0a2b2d" stroke-width="2" stroke-linejoin="round">
    <rect x="16" y="4" width="12" height="137" fill="url(#post)"/>
    <rect x="304" y="4" width="12" height="137" fill="url(#post)"/>
    <rect x="4" y="139" width="324" height="8" fill="url(#beam)"/>
  </g>
</svg>
