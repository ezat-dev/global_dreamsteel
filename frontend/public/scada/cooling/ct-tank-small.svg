<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 95" width="330" height="95">
  <!-- 작은 수조(쿨링타워 아래). 원본 obj-20.png(330x95)을 대신한다. 한 자리에만 쓴다 — obj-2.
       큰 수조와 달리 틀과 물이 한 그림에 같이 있다.

       물 색·수면선·깊이 음영은 큰 수조(ct-water.svg)와 같은 규칙으로 맞췄다.
       둘이 같은 물이라 색이 다르면 한 화면에서 따로 논다 — 한쪽을 고치면 같이 고칠 것.

       viewBox가 칸(330x95)과 같다. CSS에 object-fit: cover가 걸려 있어 비율이 어긋나면 잘린다.

       원본 좌표: 왼 기둥 x 16~28, 오른 기둥 x 304~316, 둘 다 y 4~84
                  물 x 28~304, y 6~84
                  받침 x 4~328, y 84~91 -->
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9df0ff"/>
      <stop offset=".06" stop-color="#3ad8ff"/>
      <stop offset=".35" stop-color="#00ccff"/>
      <stop offset=".72" stop-color="#00b2e8"/>
      <stop offset="1" stop-color="#0088c0"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05585c"/>
      <stop offset=".35" stop-color="#12969a"/>
      <stop offset=".62" stop-color="#0c7a7e"/>
      <stop offset="1" stop-color="#054a4e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12969a"/>
      <stop offset=".4" stop-color="#0c7a7e"/>
      <stop offset="1" stop-color="#054a4e"/>
    </linearGradient>
  </defs>

  <!-- 물 (기둥보다 먼저 그려 뒤로 깔린다) -->
  <rect x="28" y="6" width="276" height="78" fill="url(#deep)"/>
  <rect x="28" y="6" width="276" height="2.6" fill="#d6faff" opacity=".85"/>
  <rect x="28" y="8.6" width="276" height="1.6" fill="#7ee8ff" opacity=".6"/>
  <rect x="28" y="24" width="276" height="4" fill="#ffffff" opacity=".13"/>
  <rect x="28" y="52" width="276" height="2.4" fill="#ffffff" opacity=".08"/>

  <g stroke="#0a2b2d" stroke-width="2" stroke-linejoin="round">
    <rect x="16" y="4" width="12" height="82" fill="url(#post)"/>
    <rect x="304" y="4" width="12" height="82" fill="url(#post)"/>
    <rect x="4" y="84" width="324" height="8" fill="url(#beam)"/>
  </g>
</svg>
