<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>(주)글로벌 드림스틸</title>

    <!-- 태블릿 홈화면 바로가기를 앱처럼 띄우기 위한 것.

         바로가기가 그냥 URL이면 누를 때마다 크롬이 새 탭을 열어서, 현장에서 홈화면을
         오갈 때마다 탭이 쌓인다. manifest의 display: standalone이 붙으면 크롬이
         독립 창으로 띄우고 같은 창을 다시 쓴다(주소창·탭 줄도 사라진다).

         크롬이 이 기능을 HTTPS에서만 받아 줄 수 있다 — 지금은 사내망 HTTP라 안 먹으면
         홈화면 바로가기를 다시 만들어 봐야 하고, 그래도 안 되면 다른 방법을 찾아야 한다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#161e2c" />
    <!-- 브라우저 탭 아이콘. 로고 왼쪽 문양만 잘라 쓴다 — 가로로 긴 로고 전체를 넣으면
         16px으로 줄었을 때 글자가 뭉개져 무슨 그림인지 알아볼 수가 없다. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 아이패드용(안드로이드는 위 manifest를 본다) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
