plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mes'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 컨트롤러 요청·응답을 로그 파일에 남기는 ControllerLogAspect가 쓴다.
    // spring-boot-starter-web에 spring-aop은 딸려 오지만 @Aspect를 엮으려면 이것이 필요하다.
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.10'

    // 도메인 클래스의 getter/setter를 @Data로 대신 생성한다.
    // compileOnly + annotationProcessor 둘 다 필요하다 — 앞은 어노테이션을 알아보게,
    // 뒤는 컴파일 시점에 실제 코드를 만들어내게 한다. 버전은 스프링 부트가 관리한다.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

}

tasks.named('test') {
    useJUnitPlatform()
}

/*
 * 화면(frontend)까지 jar 하나에 넣는다 — 서버에서는 서비스(WinSW) 하나로 8081에서 화면과 API를 같이 내보낸다.
 *
 * bootJar에만 건다. bootRun(run-backend.bat)·compileJava에는 걸지 않는다 — 개발할 때는 화면을 vite(5051)로
 * 띄우고, 백엔드만 다시 띄울 때마다 프론트 빌드(수십 초)를 기다릴 이유가 없다.
 *
 * 화면이 부르는 주소는 그대로 둬도 된다: 백엔드는 "지금 연 주소의 8081", C#은 "지금 연 주소의 5050"을 본다
 * (frontend/src/api/axiosInstance.js, plcApiInstance.js). 8081에서 화면을 열면 백엔드는 자기 자신이 된다.
 * 단 frontend/.env에 VITE_API_BASE_URL=http://localhost:8081 같은 값이 있으면 빌드에 박혀서, 다른 PC·태블릿에서
 * 열면 그 기기의 localhost를 부른다 — 서버에서 jar를 만들 때는 .env가 없거나 그 두 값이 비어 있어야 한다.
 *
 * 프론트 폴더 위치는 -PfrontendDir=... 로 바꿀 수 있다(기본은 이 폴더 옆의 ../frontend).
 * npm이 PATH에 없는 창에서도 되도록 윈도우에서는 nodejs 기본 설치 경로를 앞에 붙인다(run-frontend.bat과 같다).
 */
def frontendDir = file(project.findProperty('frontendDir') ?: '../frontend')

tasks.register('buildFrontend', Exec) {
    description = '화면(frontend)을 빌드한다 — dist/를 bootJar가 jar 안 static/에 넣는다'
    workingDir frontendDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        environment 'PATH', 'C:\\Program Files\\nodejs;' + System.getenv('PATH')
        commandLine 'cmd', '/c', 'npm', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
    // 바뀐 게 없으면 다시 빌드하지 않는다
    inputs.dir(new File(frontendDir, 'src'))
    inputs.dir(new File(frontendDir, 'public'))
    inputs.files(new File(frontendDir, 'index.html'), new File(frontendDir, 'package.json'), new File(frontendDir, 'vite.config.js'))
    outputs.dir(new File(frontendDir, 'dist'))
}

tasks.named('bootJar') {
    dependsOn 'buildFrontend'
    from(new File(frontendDir, 'dist')) {
        into 'BOOT-INF/classes/static'
    }
}
