server:
  port: 8081
  servlet:
    session:
      # 무활동 만료 없음. 기본값은 30분인데, 이 프로젝트에서는 그게 생각보다 빨리 온다 —
      # 화면이 1초마다 폴링하는 것은 C#(5050)이고 자바(8081)로는 요청이 가지 않아서,
      # 화면을 켜두고 보고만 있으면 세션이 갱신되지 않는다. 30분 뒤 버튼을 누르면
      # 거부되는데, 현장에서 그건 곤란하다.
      timeout: -1
      # 정상 종료(Ctrl+C) 시 세션을 파일로 저장해두고 다시 켤 때 복원한다.
      # 강제 종료(프로세스 kill, 전원 차단)면 날아간다 — 그때까지 보장이 필요해지면
      # spring-session-jdbc로 DB에 저장하는 방식으로 바꿔야 한다.
      persistent: true

spring:
  application:
    name: scada-backend
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    # SCADA 화면이 쓰는 스키마(global_dream, 별도 서버 192.168.1.45).
    # 계정/비밀번호는 레포에 커밋하지 않고 환경변수로 주입한다 — run-backend.bat 참고.
    # 실행 전 DB_USERNAME, DB_PASSWORD 필수 / DB_HOST, DB_PORT, DB_NAME은 기본값 있음.
    url: jdbc:mariadb://${DB_HOST:192.168.1.45}:${DB_PORT:3306}/${DB_NAME:global_dreamsteel}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB가 아직 준비되지 않아도 서버 기동은 되도록 함
      initialization-fail-timeout: -1

# PLC 하드웨어와 통신하는 C# API 서버(C#/PlcApiServer). 별도 머신에서 돌기 때문에
# localhost가 아니라 실제 네트워크 주소를 써야 한다.
plc-api:
  base-url: ${PLC_API_BASE_URL:http://localhost:5050}

logging:
  level:
    com.mes: debug
  # 콘솔과 함께 파일에도 남긴다. 콘솔은 스크롤백이 짧고 새 출력이 오면 맨 아래로
  # 끌려가서, 지나간 오류를 되짚기에는 파일이 낫다(에디터로 열거나 검색할 수 있다).
  #
  # 절대 경로인 이유: 상대 경로('logs/backend.log')로 두면 실행 디렉터리에 따라
  # 로그가 갈린다. run-backend.bat은 backend/로 cd 하고 IDE는 저장소 루트에서 띄워서,
  # 실제로 파일이 두 군데 생기고 "로그가 안 남는다"고 한참 찾았다.
  # 다른 PC에 올릴 때는 LOG_DIR 환경변수로 덮으면 되고, 안 주면 이 경로를 쓴다.
  file:
    name: ${LOG_DIR:D:/글로벌드림스틸/web/global_dreamsteel/logs}/backend.log
  logback:
    rollingpolicy:
      # 넘긴 파일 이름. 이걸 안 적으면 스프링 기본값이 끝에 .gz를 붙여 압축해 버려서,
      # 지난 날짜 로그를 보려면 먼저 풀어야 한다 — 파일로 남기는 이유가 "에디터로 열거나
      # 검색할 수 있다"인데 그게 안 된다. 평문으로 두려고 직접 적는다.
      # 위 name과 같은 폴더를 봐야 한다 — 여기만 상대 경로로 두면 넘긴 파일만 딴 데 쌓인다.
      file-name-pattern: ${LOG_DIR:D:/글로벌드림스틸/web/global_dreamsteel/logs}/backend.log.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      # 실측으로 하루 150KB 안팎이다(제일 많이 쓴 날 154KB). 1년치를 남겨도 수십 MB라
      # 아낄 이유가 없다 — 현장에서 "지난달 그때"를 되짚을 수 있는 쪽이 낫다.
      # total-size-cap은 그래도 상한을 못 박고 싶을 때 여기에 더하면 된다.
      max-history: 365

scada:
  export:
    enabled: true
    dir: D:/온도데이터        # 역슬래시 대신 슬래시 — 이스케이프 안 해도 된다

